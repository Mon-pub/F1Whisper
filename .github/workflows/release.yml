name: F1Whisper Release

# Cut a signed F1Whisper (onprem) release by pushing a version tag, e.g.:
#
#     git tag v6.4.3-1 && git push origin v6.4.3-1
#
# This builds the onprem flavor in the `release` build type, signs it with the
# F1Whisper release keystore (provided via repository secrets), verifies the
# signature with apksigner, and publishes the signed APK(s) to a GitHub Release.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   F1W_KEYSTORE_BASE64    base64 (no newlines) of f1whisper-release.jks
#   F1W_KEYSTORE_PASSWORD  keystore (store) password
#   F1W_KEY_ALIAS          key alias (f1whisper)
#   F1W_KEY_PASSWORD       key password
#
# See RELEASING.md for the full procedure.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-signed-release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    env:
      # NDK + Rust pins for the libthreema native build (kept in sync with app/build.gradle.kts
      # and domain/libthreema/rust-toolchain.toml).
      NDK_VERSION: "28.2.13676358"
      RUST_VERSION: "1.94"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          yes | sdkmanager --install "ndk;${NDK_VERSION}" "build-tools;35.0.0" "platforms;android-35"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Rust ${{ env.RUST_VERSION }} with Android targets
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          # arm-mobile release (see -ParmMobile below): aarch64 + armv7 Android targets. The armv7
          # slice serves arm64 SoCs with a 32-bit-only userspace (low-RAM Android Go devices).
          # To restore the full 4-ABI build, add back i686-linux-android,x86_64-linux-android.
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            domain/libthreema/target
          key: cargo-${{ runner.os }}-${{ hashFiles('domain/libthreema/Cargo.lock', 'domain/libthreema/rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Decode release keystore
        env:
          F1W_KEYSTORE_BASE64: ${{ secrets.F1W_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${F1W_KEYSTORE_BASE64}" ]; then
            echo "::error::F1W_KEYSTORE_BASE64 secret is not set. Cannot produce a signed release."
            exit 1
          fi
          echo "${F1W_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/f1whisper-release.jks"
          echo "F1W_KEYSTORE_FILE=${RUNNER_TEMP}/f1whisper-release.jks" >> "$GITHUB_ENV"

      - name: Build signed onprem release
        env:
          F1W_KEYSTORE_PASSWORD: ${{ secrets.F1W_KEYSTORE_PASSWORD }}
          F1W_KEY_ALIAS: ${{ secrets.F1W_KEY_ALIAS }}
          F1W_KEY_PASSWORD: ${{ secrets.F1W_KEY_PASSWORD }}
        run: |
          ./gradlew assembleOnpremRelease \
            --no-daemon \
            -PnoAbiSplits \
            -ParmMobile \
            -Pf1wReleaseName="${GITHUB_REF_NAME}" \
            --no-parallel \
            --stacktrace

      - name: Locate built APK(s)
        id: apks
        run: |
          mapfile -t apks < <(find app/build/outputs/apk/onprem/release -name "*.apk" | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No APK produced by assembleOnpremRelease."
            exit 1
          fi
          {
            echo "list<<EOF"
            printf '%s\n' "${apks[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          printf 'Found APK(s):\n%s\n' "${apks[*]}"

      - name: Verify signatures with apksigner
        run: |
          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner"
          while IFS= read -r apk; do
            [ -z "$apk" ] && continue
            echo "::group::apksigner verify ${apk}"
            "${APKSIGNER}" verify --verbose --print-certs "$apk"
            echo "::endgroup::"
          done <<< "${{ steps.apks.outputs.list }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: F1Whisper ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## F1Whisper ${{ github.ref_name }}

            Self-hosted, end-to-end-encrypted messenger (F1Tech fork of Threema for Android),
            built for the F1Whisper onprem backend.

            Signed `onprem` release APK(s), verified with `apksigner verify`.
            Point the setup wizard server field at your F1Whisper host.

            Built from commit `${{ github.sha }}`.
          files: |
            app/build/outputs/apk/onprem/release/*.apk

      - name: Remove decoded keystore
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/f1whisper-release.jks"
          echo "Decoded keystore removed."
